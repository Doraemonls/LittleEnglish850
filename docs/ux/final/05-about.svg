</defs><rect x="0" y="0" width="1570" height="1761" rx="0" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="0" /><rect x="0" y="0" width="1570" height="6" rx="0" fill="#ACDF82" stroke="#C6DAD9" stroke-width="0" /><text x="44" y="48" font-size="15" font-weight="700" fill="#536D75" text-anchor="start" >LITTLE ENGLISH / SUNNY MEMPHIS</text><text x="1526" y="48" font-size="14" font-weight="600" fill="#536D75" text-anchor="end" >最终设计 · 2026.10</text><text x="44" y="105" font-size="37" font-weight="800" fill="#29424A" text-anchor="start" >关于页 / 让学习的意义先被看见</text><text x="44" y="140" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="1482" >保留 Ogden 的历史简介与中英文内容，把标语放在页面正文最上方。</text><rect x="44" y="182" width="58" height="44" rx="22" fill="#FFC938" stroke="#697E83" stroke-width="1.25" /><text x="73.0" y="210" font-size="15" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="44" >A1</text><text x="118" y="210" font-size="19" font-weight="700" fill="#29424A" text-anchor="start" >中文 · 桌面</text><rect x="44" y="236" width="1000" height="1072" rx="20" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="0" filter="url(#soft-shadow)"/><svg x="44" y="236" width="1000" height="1072" viewBox="0 0 1000 1072" overflow="hidden" data-screen="true"><rect x="0" y="0" width="1000" height="1072" rx="18" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="0" /><g aria-hidden="true" pointer-events="none" data-decoration="background"><g transform="translate(917 401) rotate(-10)" opacity="0.72" data-decoration="emoji" aria-hidden="true"><text x="0" y="0" font-size="18" style="font-family:Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif">🌱</text></g><circle cx="29" cy="471" r="4" fill="#FFC938" stroke="#C6DAD9" stroke-width="0"/></g><rect x="0" y="0" width="1000" height="76" rx="0" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="0" /><path d="M0 76L1000 76" fill="none" stroke="#C6DAD9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><use href="#i-book" x="28" y="23" width="30" height="30" color="#29424A"/><text x="71" y="47" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >小小英语</text><use href="#i-back" x="28" y="92" width="22" height="22" color="#29424A"/><text x="62" y="112" font-size="16" font-weight="700" fill="#29424A" text-anchor="start" >家长设置</text><rect x="751" y="89" width="80" height="44" rx="22" fill="#FFC938" stroke="#697E83" stroke-width="1.25" /><text x="791.0" y="117" font-size="15" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="66" >中文</text><rect x="845" y="89" width="126" height="44" rx="22" fill="#FFFFFF" stroke="#697E83" stroke-width="1.25" /><text x="908.0" y="117" font-size="15" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="112" >English</text><rect x="38" y="153" width="924" height="206" rx="16" fill="#DCF2FF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="69" y="224" font-size="42" font-weight="800" fill="#29424A" text-anchor="start" >AI 让答案更近，</text><text x="69" y="284" font-size="42" font-weight="800" fill="#29424A" text-anchor="start" >学习让世界更大。</text><circle cx="878" cy="259" r="8" fill="#FFC938" stroke="#C6DAD9" stroke-width="0"/><g transform="translate(812 200) scale(0.3)" ><path d="M0 12Q12 -7 24 12T48 12T72 12T96 12" fill="none" stroke="#ACDF82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="64" y="433" font-size="36" font-weight="800" fill="#29424A" text-anchor="start" >关于小小英语</text><text x="64" y="497" font-size="23" font-weight="800" fill="#29424A" text-anchor="start" >850 个词的由来</text><text x="64" y="536" font-size="19" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="855" >1930 年，英国学者 C. K. Ogden（奥格登）出版《Basic English》，介绍了一套以 850 个核心词为</text><text x="64" y="568" font-size="19" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="855" >基础的精简英语体系，希望帮助更多人用英语交流。小小英语以这份词表为起点，搭配中文释义、</text><text x="64" y="600" font-size="19" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="855" >发音和简短例句。</text><text x="64" y="673" font-size="23" font-weight="800" fill="#29424A" text-anchor="start" >从小小的一步开始</text><text x="64" y="712" font-size="19" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="855" >850 个词给初学者一个清晰、有限的起点。家长可以陪孩子听词、认意思、拼写，再把词放进句子</text><text x="64" y="744" font-size="19" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="855" >里；成人初学者也可以按自己的节奏练习。随着阅读和兴趣增加，再逐步扩展词汇。</text><text x="64" y="817" font-size="23" font-weight="800" fill="#29424A" text-anchor="start" >有了 AI，学习依然有意义</text><text x="64" y="856" font-size="19" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="855" >AI 可以帮助翻译、解释和练习。学会英语，能让我们更直接地阅读原文、提出问题，也更有能力判</text><text x="64" y="888" font-size="19" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="855" >断 AI 的回答。每认识一个新词，就多了一条探索世界、与人交流的路。</text><path d="M64 954L917 954" fill="none" stroke="#C6DAD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="992" font-size="16" font-weight="700" fill="#29424A" text-anchor="start" >延伸阅读</text><text x="64" y="1030" font-size="17" font-weight="700" fill="#275D7D" text-anchor="start" >Basic English 简史</text><text x="354" y="1030" font-size="17" font-weight="700" fill="#275D7D" text-anchor="start" >Ogden 850 词表</text></svg><rect x="44" y="236" width="1000" height="1072" rx="18" fill="none" stroke="#C6DAD9" stroke-width="1.5" /><rect x="1091" y="182" width="58" height="44" rx="22" fill="#FFC938" stroke="#697E83" stroke-width="1.25" /><text x="1120.0" y="210" font-size="15" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="44" >A2</text><text x="1165" y="210" font-size="19" font-weight="700" fill="#29424A" text-anchor="start" >English · 手机整页</text><rect x="1091" y="236" width="430" height="1423" rx="20" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="0" filter="url(#soft-shadow)"/><svg x="1091" y="236" width="430" height="1423" viewBox="0 0 430 1423" overflow="hidden" data-screen="true"><rect x="0" y="0" width="430" height="1423" rx="18" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="0" /><g aria-hidden="true" pointer-events="none" data-decoration="background"><g transform="translate(372 395) rotate(-10)" opacity="0.72" data-decoration="emoji" aria-hidden="true"><text x="0" y="0" font-size="18" style="font-family:Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif">🌱</text></g><circle cx="12" cy="471" r="4" fill="#FFC938" stroke="#C6DAD9" stroke-width="0"/></g><rect x="0" y="0" width="430" height="76" rx="0" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="0" /><path d="M0 76L430 76" fill="none" stroke="#C6DAD9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><use href="#i-book" x="28" y="23" width="30" height="30" color="#29424A"/><text x="71" y="47" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >小小英语</text><use href="#i-back" x="25" y="94" width="21" height="21" color="#29424A"/><text x="57" y="112" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >Parent settings</text><rect x="252" y="88" width="68" height="44" rx="22" fill="#FFFFFF" stroke="#697E83" stroke-width="1.25" /><text x="286.0" y="116" font-size="14" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="54" >中文</text><rect x="330" y="88" width="79" height="44" rx="22" fill="#FFC938" stroke="#697E83" stroke-width="1.25" /><text x="369.5" y="116" font-size="14" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="65" >English</text><rect x="20" y="157" width="390" height="212" rx="14" fill="#DCF2FF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="41" y="204" font-size="30" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="348" >AI brings</text><text x="41" y="247" font-size="30" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="348" >answers closer.</text><text x="41" y="290" font-size="30" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="348" >Learning opens up</text><text x="41" y="333" font-size="30" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="348" >your world.</text><text x="25" y="434" font-size="30" font-weight="800" fill="#29424A" text-anchor="start" >About Little English</text><text x="25" y="491" font-size="21" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="378" >Where the 850 words began</text><text x="25" y="534" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >In 1930, British scholar C. K. Ogden</text><text x="25" y="561" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >published Basic English. It described a</text><text x="25" y="588" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >simplified form of English built around 850</text><text x="25" y="615" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >core words, to help more people</text><text x="25" y="642" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >communicate. Little English uses that word</text><text x="25" y="669" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >list as a starting point, with Chinese</text><text x="25" y="696" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >meanings, audio and short example</text><text x="25" y="723" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >sentences.</text><text x="25" y="785" font-size="21" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="378" >A small first step</text><text x="25" y="828" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >These 850 words give beginners a small,</text><text x="25" y="855" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >clear place to start. Parents can listen,</text><text x="25" y="882" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >explore meanings and practise spelling</text><text x="25" y="909" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >with their children, then use the words in</text><text x="25" y="936" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >sentences. Adults can learn at their own</text><text x="25" y="963" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >pace, too. Grow your vocabulary as your</text><text x="25" y="990" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >interests and reading grow.</text><text x="25" y="1052" font-size="21" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="378" >Learning still matters with AI</text><text x="25" y="1095" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >AI can help us translate, explain and</text><text x="25" y="1122" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >practise. Learning English helps us read</text><text x="25" y="1149" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >original texts, ask our own questions and</text><text x="25" y="1176" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >judge AI’s answers. Each new word gives</text><text x="25" y="1203" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >us another way to explore the world and</text><text x="25" y="1230" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="378" >connect with people.</text><path d="M25 1282L403 1282" fill="none" stroke="#C6DAD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="25" y="1314" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >Further reading</text><text x="25" y="1349" font-size="16" font-weight="700" fill="#275D7D" text-anchor="start" >A history of Basic English</text><text x="25" y="1381" font-size="16" font-weight="700" fill="#275D7D" text-anchor="start" >Ogden’s 850-word list</text></svg><rect x="1091" y="236" width="430" height="1423" rx="18" fill="none" stroke="#C6DAD9" stroke-width="1.5" /><circle cx="61" cy="1374" r="17" fill="#FFC938" stroke="#C6DAD9" stroke-width="1.5"/><text x="61" y="1380" font-size="16" font-weight="800" fill="#29424A" text-anchor="middle" >1</text><text x="92" y="1380" font-size="21" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="406" >标语位于正文最前面</text><text x="92" y="1411" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="406" >中英文共用淡蓝标语区与深色文字；语言切换一直可</text><text x="92" y="1437" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="406" >见。</text><circle cx="597" cy="1374" r="17" fill="#FFC938" stroke="#C6DAD9" stroke-width="1.5"/><text x="597" y="1380" font-size="16" font-weight="800" fill="#29424A" text-anchor="middle" >2</text><text x="628" y="1380" font-size="21" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="416" >长文保持清楚舒展</text><text x="628" y="1411" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="416" >正文采用白底灰墨色字，装饰只在标题附近的留白。</text><path d="M44 1712L1526 1712" fill="none" stroke="#C6DAD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="1738" font-size="13" font-weight="400" fill="#536D75" text-anchor="start" >小小英语 · 静态设计样例 · SVG 图形与系统 emoji</text><text x="1526" y="1738" font-size="13" font-weight="700" fill="#29424A" text-anchor="end" >05-about</text></svg>