  <rect x="508" y="842" width="370" height="76" rx="14" fill="#A8D5A2" stroke="#59665F" stroke-width="1" />
  <text x="655.5" y="865" font-size="25" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">正在学</text>
  <polyline points="893,880 941,880" fill="none" stroke="#59665F" stroke-width="2" />
  <polyline points="934,873 941,880 934,887" fill="none" stroke="#59665F" stroke-width="2" />
  <rect x="960" y="842" width="370" height="76" rx="14" fill="#25613D" stroke="#59665F" stroke-width="1" />
  <text x="1120.0" y="865" font-size="25" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">学过</text>
  <polyline points="1345,880 1393,880" fill="none" stroke="#59665F" stroke-width="2" />
  <polyline points="1386,873 1393,880 1386,887" fill="none" stroke="#59665F" stroke-width="2" />
  <rect x="1412" y="842" width="370" height="76" rx="14" fill="#C58A16" stroke="#59665F" stroke-width="1" />
  <text x="1559.5" y="865" font-size="25" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">记牢了</text>
  <text x="62" y="944" font-size="19" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">进入新课词卡</text>
  <text x="514" y="944" font-size="19" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">完成词卡和三种练习</text>
  <text x="966" y="944" font-size="19" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">多轮到期复习通过</text>
  <text x="56" y="1011" font-size="22" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#24312D" dominant-baseline="text-before-edge">巩固时若有失误，金色回到深绿；累计学过的记录保留。</text>
  <polyline points="56,1090 1784,1090" fill="none" stroke="#A8B1AA" stroke-width="1" />
  <text x="56" y="1110" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">比例真实</text>
  <text x="56" y="1150" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">实际按唯一词数换算；本图仅说明配色。</text>
  <text x="508" y="1110" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">各段不重复</text>
  <text x="508" y="1150" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">深绿学过与金色记牢分开；累计学过为两段之</text>
  <text x="508" y="1179" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">和。</text>
  <text x="960" y="1110" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">儿童页面用短标签</text>
  <text x="960" y="1150" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">条内不塞数字，三个色块和文字帮助理解。</text>
  <text x="1412" y="1110" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">长期记忆继续巩固</text>
  <text x="1412" y="1150" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">记牢了由复习结果判定，之后按 30 天间隔再</text>
  <text x="1412" y="1179" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">检查。</text>
