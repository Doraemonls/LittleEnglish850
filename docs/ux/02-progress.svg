  <text x="1256" y="613" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#24312D" dominant-baseline="text-before-edge">连续三次到期复习独立通过，</text>
  <text x="1256" y="647" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#24312D" dominant-baseline="text-before-edge">以后每隔一段时间再巩固。</text>
  <text x="56" y="780" font-size="27" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">学习时，颜色这样变化</text>
  <rect x="56" y="842" width="370" height="76" rx="14" fill="#E7EBE5" stroke="#59665F" stroke-width="1" />
