<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1300" viewBox="0 0 1840 1300">
  <title>进度条：正在学 → 学过 → 记牢了</title>
  <desc>同一个词只占一个区段；颜色表示当前学习阶段。</desc>
