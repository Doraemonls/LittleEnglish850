  <text x="1200.0" y="440" font-size="22" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">尚未开始  84%</text>
  <rect x="56" y="531" width="552" height="194" rx="16" fill="#FFFFFF" stroke="#A8B1AA" stroke-width="1" />
