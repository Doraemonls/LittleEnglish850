  <text x="56" y="63" font-size="38" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">02  进度条：正在学 → 学过 → 记牢了</text>
  <text x="56" y="118" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">同一个词只占一个区段；颜色表示当前学习阶段。</text>
  <text x="56" y="197" font-size="27" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#24312D" dominant-baseline="text-before-edge">配色与比例示意</text>
  <text x="56" y="243" font-size="22" font-family="Microsoft YaHei, sans-serif" font-weight="400" fill="#59665F" dominant-baseline="text-before-edge">深绿 10%  +  浅绿 5%  +  金色 1%  +  灰色背景 84%</text>
  <rect x="56" y="316" width="1728" height="52" rx="8" fill="#E7EBE5" stroke="none" stroke-width="1" />
