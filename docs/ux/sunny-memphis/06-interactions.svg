t-size="15" font-weight="600" fill="#29424A" text-anchor="start" >按下</text><rect x="1128" y="579" width="268" height="54" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25" /><text x="1252" y="613" font-size="19" font-weight="700" fill="#29424A" text-anchor="middle" >Continue</text><use href="#i-arrow" x="1353" y="594" width="24" height="24" color="#29424A"/><text x="1129" y="687" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" >焦点有外圈；按下时轻微下移。</text><text x="44" y="800" font-size="26" font-weight="800" fill="#29424A" text-anchor="start" >只在需要时出现的反馈</text><rect x="44" y="837" width="482" height="193" rx="14" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><rect x="64" y="861" width="438" height="59" rx="9" fill="#FFFFFF" stroke="#A54E41" stroke-width="1.5" /><text x="86" y="897" font-size="26" font-weight="700" fill="#275D7D" text-anchor="start" >│</text><text x="66" y="957" font-size="22" font-weight="700" fill="#29424A" text-anchor="start" >Try again</text><text x="48" y="1063" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="474" >交互：输入清空，焦点留在同一输入框。</text><rect x="554" y="837" width="482" height="193" rx="14" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><circle cx="595" cy="879" r="18" fill="#287A55" stroke="#C6DAD9" stroke-width="0"/><use href="#i-check" x="583" y="867" width="24" height="24" color="#FFFFFF"/><text x="628" y="887" font-size="23" font-weight="800" fill="#29424A" text-anchor="start" >Correct!</text><rect x="576" y="948" width="438" height="55" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25" filter="url(#soft-shadow)"/><text x="785.0" y="982.5" font-size="19" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="388" >Continue</text><use href="#i-arrow" x="971" y="963.5" width="24" height="24" color="#29424A"/><text x="558" y="1063" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="474" >交互：由孩子点击继续，不自动跳题。</text><rect x="1064" y="837" width="482" height="193" rx="14" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="1086" y="884" font-size="23" font-weight="800" fill="#29424A" text-anchor="start" >Paused</text><text x="1086" y="924" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="436" >Progress saved</text><rect x="1086" y="958" width="258" height="52" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25" filter="url(#soft-shadow)"/><text x="1205.0" y="991.0" font-size="18" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="208" >Keep going</text><use href="#i-arrow" x="1301" y="972.0" width="24" height="24" color="#29424A"/><text x="1378" y="991" font-size="16" font-weight="700" fill="#29424A" text-anchor="start" >Home</text><rect x="44" y="1097" width="482" height="193" rx="14" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="66" y="1144" font-size="23" font-weight="800" fill="#29424A" text-anchor="start" >Sound is unavailable</text><text x="48" y="1323" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="474" >交互：当前听音题等待声音恢复。</text><rect x="66" y="1218" width="258" height="52" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25" filter="url(#soft-shadow)"/><text x="185.0" y="1251.0" font-size="18" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="208" >Try again</text><use href="#i-arrow" x="281" y="1232.0" width="24" height="24" color="#29424A"/><rect x="554" y="1097" width="482" height="193" rx="14" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="576" y="1144" font-size="23" font-weight="800" fill="#29424A" text-anchor="start" >Progress not saved</text><text x="558" y="1323" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="474" >交互：重试成功后才收起此提示。</text><text x="57