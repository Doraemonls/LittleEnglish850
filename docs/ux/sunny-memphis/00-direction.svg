</defs><rect x="0" y="0" width="1490" height="1420" rx="0" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="0" /><rect x="0" y="0" width="1490" height="6" rx="0" fill="#ACDF82" stroke="#C6DAD9" stroke-width="0" /><text x="44" y="48" font-size="15" font-weight="700" fill="#536D75" text-anchor="start" >LITTLE ENGLISH / SUNNY MEMPHIS</text><text x="1446" y="48" font-size="14" font-weight="600" fill="#536D75" text-anchor="end" >设计 · 2026.10</text><text x="44" y="105" font-size="37" font-weight="800" fill="#29424A" text-anchor="start" >视觉方向 / Sunny Memphis</text><text x="44" y="140" font-size="17" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="1402" >把粉彩调得更鲜活，背景带一点阳光与天空的颜色；句子回到常规字重。</text><rect x="44" y="188" width="780" height="340" rx="16" fill="#FFF0C2" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="80" y="260" font-size="44" font-weight="800" fill="#29424A" text-anchor="start" >有阳光，也有蓝天。</text><text x="82" y="304" font-size="21" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="690" >明快的黄、蓝、绿与珊瑚色，让学习更有朝气。</text><g transform="translate(91 346) scale(0.86)" aria-hidden="true"><rect x="9" y="29" width="174" height="117" rx="5" fill="#FFC938" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><path d="M15 21Q53 11 95 30Q128 12 170 22V129Q128 120 95 138Q56 121 15 129Z" fill="#FFFFFF" stroke="#29424A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M95 30L95 138" fill="none" stroke="#C6DAD9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="63" font-size="20" font-weight="800" fill="#29424A" text-anchor="start" >hello</text><path d="M33 81L74 81" fill="none" stroke="#C6DAD9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M33 96L64 96" fill="none" stroke="#C6DAD9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(112 43) scale(0.45)" ><path d="M50 31C25 8 3 30 10 61C13 87 33 99 50 90C67 99 87 87 91 61C97 30 75 8 50 31Z" fill="#F47E68" stroke="#29424A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 30Q45 15 53 4" fill="none" stroke="#29424A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M54 18Q62 -1 82 8Q73 27 54 18Z" fill="#287A55" stroke="#29424A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M27 39Q19 47 22 56" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="114" y="112" font-size="14" font-weight="700" fill="#29424A" text-anchor="start" >apple</text></g><g transform="translate(735 469) rotate(-10)" opacity="0.72" data-decoration="emoji" aria-hidden="true"><text x="0" y="0" font-size="24" style="font-family:Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif">🌱</text></g><circle cx="678" cy="364" r="6" fill="#F47E68" stroke="#C6DAD9" stroke-width="0"/><g transform="translate(613 469) scale(0.35)" ><path d="M0 12Q12 -7 24 12T48 12T72 12T96 12" fill="none" stroke="#68BFEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="321" y="382" width="250" height="58" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25" filter="url(#soft-shadow)"/><text x="436.0" y="418.0" font-size="21" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="200" >开始学单词</text><use href="#i-arrow" x="528" y="399.0" width="24" height="24" color="#29424A"/><text x="323" y="474" font-size="17" font-weight="400" fill="#536D75" text-anchor="start" >色彩鲜活，句子轻松读。</text><text x="874" y="224" font-size="28" font-weight="800" fill="#29424A" text-anchor="start" >更有颜色，阅读仍然轻松</text><circle cx="891" cy="267" r="17" fill="#FFC938" stroke="#C6DAD9" stroke-width="1.5"/><text x="891" y="273" font-size="16" font-weight="800" fill="#29424A" text-anchor="middle" >1</text><text x="922" y="273" font-size="21" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="522" >把黄、蓝、绿提亮</text><text x="922" y="304" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="522" >向日葵黄用于主按钮，晴空蓝用于播放，鲜叶绿用于状态。</text><circle cx="891" cy="358" r="17" fill="#FFC938" stroke="#C6DAD9" stroke-width="1.5"/><text x="891" y="364" font-size="16" font-weight="800" fill="#29424A" text-anchor="middle" >2</text><text x="922" y="364" font-size="21" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="522" >背景也有一点颜色</text><text x="922" y="395" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="522" >首页铺浅暖黄，学习页铺浅天蓝；内容卡仍用白色与轻阴影。</text><circle cx="891" cy="449" r="17" fill="#FFC938" stroke="#C6DAD9" stroke-width="1.5"/><text x="891" y="455" font-size="16" font-weight="800" fill="#29424A" text-anchor="middle" >3</text><text x="922" y="455" font-size="21" font-weight="800" fill="#29424A" text-anchor="start" data-max-width="522" >句子使用常规字重</text><text x="922" y="486" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" data-max-width="522" >提问和例句用 400 字重；重点单词靠字号突出，装饰仍小而少。</text><text x="44" y="592" font-size="28" font-weight="800" fill="#29424A" text-anchor="start" >基础色与用途</text><rect x="44" y="620" width="178" height="100" rx="10" fill="#FFC938" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="44" y="754" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >向日葵黄</text><text x="44" y="782" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >#FFC938</text><text x="44" y="807" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" >主行动 / 记牢了</text><rect x="246" y="620" width="178" height="100" rx="10" fill="#68BFEA" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="246" y="754" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >晴空蓝</text><text x="246" y="782" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >#68BFEA</text><text x="246" y="807" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" >播放按钮</text><rect x="448" y="620" width="178" height="100" rx="10" fill="#ACDF82" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="448" y="754" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >鲜叶绿</text><text x="448" y="782" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >#ACDF82</text><text x="448" y="807" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" >点缀 / 正在学</text><rect x="650" y="620" width="178" height="100" rx="10" fill="#F47E68" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="650" y="754" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >珊瑚红</text><text x="650" y="782" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >#F47E68</text><text x="650" y="807" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" >插画 / 小圆点</text><rect x="852" y="620" width="178" height="100" rx="10" fill="#287A55" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="852" y="754" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >草地深绿</text><text x="852" y="782" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >#287A55</text><text x="852" y="807" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" >学过 / 正确反馈</text><rect x="1054" y="620" width="178" height="100" rx="10" fill="#29424A" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="1054" y="754" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >墨蓝灰</text><text x="1054" y="782" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >#29424A</text><text x="1054" y="807" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" >清晰的文字</text><rect x="1256" y="620" width="178" height="100" rx="10" fill="#FFF0C2" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="1256" y="754" font-size="22" font-weight="800" fill="#29424A" text-anchor="start" >浅暖黄</text><text x="1256" y="782" font-size="15" font-weight="700" fill="#29424A" text-anchor="start" >#FFF0C2</text><text x="1256" y="807" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" >首页背景</text><text x="44" y="865" font-size="28" font-weight="800" fill="#29424A" text-anchor="start" >主操作、声音与阅读</text><rect x="44" y="896" width="430" height="202" rx="16" fill="#FFF0C2" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="68" y="931" font-size="17" font-weight="700" fill="#29424A" text-anchor="start" >向日葵黄 · 开始与继续</text><rect x="68" y="958" width="250" height="54" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25" filter="url(#soft-shadow)"/><text x="183.0" y="992.0" font-size="18" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="200" >开始学单词</text><use href="#i-arrow" x="275" y="973.0" width="24" height="24" color="#29424A"/><text x="68" y="1073" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" >一个明确的主操作，配深色文字。</text><rect x="500" y="896" width="430" height="202" rx="16" fill="#DCF2FF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="524" y="931" font-size="17" font-weight="700" fill="#29424A" text-anchor="start" >晴空蓝 · 点击播放</text><rect x="524" y="958" width="200" height="54" rx="14" fill="#68BFEA" stroke="#697E83" stroke-width="1.25" filter="url(#soft-shadow)"/><use href="#i-sound" x="544" y="973.0" width="24" height="24" color="#29424A"/><text x="636.0" y="992.0" font-size="18" font-weight="700" fill="#29424A" text-anchor="middle" data-max-width="132" >Listen</text><text x="524" y="1073" font-size="16" font-weight="400" fill="#29424A" text-anchor="start" >声音入口使用一致的蓝色和扬声器。</text><rect x="956" y="896" width="484" height="202" rx="16" fill="#FFFFFF" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><text x="980" y="931" font-size="17" font-weight="700" fill="#29424A" text-anchor="start" >句子不加粗</text><text x="980" y="973" font-size="25" font-weight="400" fill="#29424A" text-anchor="start" >Read a sentence.</text><g data-action="play-sentence" aria-label="Play sentence: This is an apple."><rect x="980" y="998" width="433" height="60" rx="12" fill="#DCF2FF" stroke="#697E83" stroke-width="1.25" /><text x="998" y="1036" font-size="22" font-weight="400" fill="#275D7D" text-anchor="start" data-max-width="361" >This is an apple.</text><use href="#i-sound" x="1371" y="1016" width="24" height="24" color="#275D7D"/></g><text x="980" y="1081" font-size="15" font-weight="400" fill="#29424A" text-anchor="start" >标题和例句均为 400 字重。</text><text x="44" y="1166" font-size="27" font-weight="800" fill="#29424A" text-anchor="start" >背景元素：小、少、分散</text><rect x="44" y="1195" width="642" height="132" rx="16" fill="#FFF0C2" stroke="#C6DAD9" stroke-width="1" filter="url(#soft-shadow)"/><circle cx="85" cy="1236" r="5" fill="#F47E68" stroke="#C6DAD9" stroke-width="0"/><g transform="translate(138 1252) scale(0.3)" ><path d="M0 12Q12 -7 24 12T48 12T72 12T96 12" fill="none" stroke="#68BFEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="245" cy="1248" r="8" fill="none" stroke="#ACDF82" stroke-width="2.5"/><g transform="translate(324 1262) rotate(10)" opacity="0.72" data-decoration="emoji" aria-hidden="true"><text x="0" y="0" font-size="23" style="font-family:Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif">🌼</text></g><g transform="translate(420 1267) rotate(-6)" opacity="0.72" data-decoration="emoji" aria-hidden="true"><text x="0" y="0" font-size="24" style="font-family:Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif">☁️</text></g><text x="480" y="1261" font-size="16" font-weight="400" fill="#536D75" text-anchor="start" >样式示意</text><text x="727" y="1224" font-size="20" font-weight="700" fill="#29424A" text-anchor="start" >桌面约 4–6 组 · 手机约 2–5 组</text><text x="727" y="1265" font-size="18" font-weight="400" fill="#29424A" text-anchor="start" >emoji 约 16–28 px；每屏最多 2 个。</text><text x="727" y="1303" font-size="18" font-weight="400" fill="#29424A" text-anchor="start" >位置固定，不飘动；题目背景只用抽象小图形。</text><path d="M44 1371L1446 1371" fill="none" stroke="#C6DAD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="1397" font-size="13" font-weight="400" fill="#536D75" text-anchor="start" >小小英语 · 静态设计样例 · SVG 图形与系统 emoji</text><text x="1446" y="1397" font-size="13" font-weight="700" fill="#29424A" text-anchor="end" >00-direction</text></svg>