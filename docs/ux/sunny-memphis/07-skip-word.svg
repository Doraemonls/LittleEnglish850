<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1320" viewBox="0 0 1620 1320" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">已会单词跳过设计</title>
  <desc id="board-desc">展示新课词卡上的次要跳过操作、确认弹窗，以及跳到下一词后的反馈。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#29424A" flood-opacity="0.10"/>
    </filter>
    <symbol id="arrow" viewBox="0 0 24 24">
      <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="check" viewBox="0 0 24 24">
      <path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="pause" viewBox="0 0 24 24">
      <path d="M8 6v12M16 6v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="sound" viewBox="0 0 24 24">
      <path d="M5 10v4h4l5 4V6l-5 4H5Zm12-1c1.3 1.6 1.3 4.4 0 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="apple" viewBox="0 0 100 100">
      <path d="M50 31C25 8 3 30 10 61C13 87 33 99 50 90C67 99 87 87 91 61C97 30 75 8 50 31Z" fill="#F47E68" stroke="#29424A" stroke-width="3" stroke-linejoin="round"/>
      <path d="M50 30Q45 15 53 4" fill="none" stroke="#29424A" stroke-width="4" stroke-linecap="round"/>
      <path d="M54 18Q62 -1 82 8Q73 27 54 18Z" fill="#287A55" stroke="#29424A" stroke-width="3" stroke-linejoin="round"/>
      <path d="M27 39Q19 47 22 56" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1620" height="1320" fill="#FFFFFF"/>
  <rect width="1620" height="6" fill="#ACDF82"/>
  <text x="44" y="48" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#536D75">LITTLE ENGLISH / SUNNY MEMPHIS</text>
  <text x="1576" y="48" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#536D75">设计 · 2026.10</text>
  <text id="title" x="44" y="105" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="37" font-weight="800" fill="#29424A">新课词卡 / 已经会了，可以跳过</text>
  <text x="44" y="140" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#29424A">只在新课词卡提供次要入口；确认后记为“学过”、安排正常复习，并进入下一词。</text>

  <!-- State labels -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="44" y="181" width="46" height="36" rx="18" fill="#FFC938" stroke="#697E83" stroke-width="1.25"/>
    <text x="67" y="205" text-anchor="middle" font-size="14" font-weight="800" fill="#29424A">01</text>
    <text x="104" y="205" font-size="19" font-weight="700" fill="#29424A">词卡：主次操作清楚</text>

    <rect x="476" y="181" width="46" height="36" rx="18" fill="#FFC938" stroke="#697E83" stroke-width="1.25"/>
    <text x="499" y="205" text-anchor="middle" font-size="14" font-weight="800" fill="#29424A">02</text>
    <text x="536" y="205" font-size="19" font-weight="700" fill="#29424A">确认：避免误触</text>

    <rect x="908" y="181" width="46" height="36" rx="18" fill="#FFC938" stroke="#697E83" stroke-width="1.25"/>
    <text x="931" y="205" text-anchor="middle" font-size="14" font-weight="800" fill="#29424A">03</text>
    <text x="968" y="205" font-size="19" font-weight="700" fill="#29424A">完成：进入下一词</text>
  </g>

  <!-- Screen 1 -->
  <g transform="translate(44 236)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect width="390" height="844" rx="20" fill="#DCF2FF" filter="url(#shadow)"/>
    <circle cx="18" cy="85" r="3" fill="#F47E68"/><circle cx="368" cy="91" r="4" fill="#ACDF82"/>
    <text x="24" y="40" font-size="16" font-weight="700" fill="#29424A">Lesson 1</text>
    <text x="114" y="40" font-size="16" fill="#536D75">1 / 5</text>
    <use href="#pause" x="285" y="20" width="24" height="24" color="#29424A"/>
    <text x="318" y="40" font-size="16" font-weight="700" fill="#29424A">Pause</text>
    <g fill="#FFFFFF" stroke="#697E83"><rect x="139" y="67" width="16" height="6" rx="3" fill="#275D7D"/><rect x="163" y="67" width="16" height="6" rx="3"/><rect x="187" y="67" width="16" height="6" rx="3"/><rect x="211" y="67" width="16" height="6" rx="3"/><rect x="235" y="67" width="16" height="6" rx="3"/></g>
    <rect x="22" y="104" width="346" height="692" rx="16" fill="#FFFFFF" stroke="#C6DAD9" filter="url(#shadow)"/>
    <circle cx="195" cy="196" r="57" fill="#FFC938"/>
    <use href="#apple" x="151" y="147" width="88" height="88"/>
    <text x="195" y="306" text-anchor="middle" font-size="52" font-weight="800" fill="#29424A">apple</text>
    <text x="195" y="344" text-anchor="middle" font-size="23" font-weight="600" fill="#29424A">苹果</text>
    <rect x="101" y="368" width="188" height="52" rx="14" fill="#68BFEA" stroke="#697E83" stroke-width="1.25"/>
    <use href="#sound" x="122" y="382" width="24" height="24" color="#29424A"/>
    <text x="205" y="401" text-anchor="middle" font-size="18" font-weight="700" fill="#29424A">Listen</text>
    <path d="M47 447H343" stroke="#C6DAD9"/>
    <rect x="46" y="468" width="298" height="60" rx="12" fill="#DCF2FF" stroke="#697E83" stroke-width="1.25"/>
    <text x="64" y="506" font-size="22" fill="#275D7D">This is an apple.</text>
    <use href="#sound" x="302" y="486" width="24" height="24" color="#275D7D"/>
    <text x="195" y="560" text-anchor="middle" font-size="19" fill="#29424A">这是一个苹果。</text>
    <rect x="46" y="613" width="298" height="56" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25"/>
    <text x="183" y="648" text-anchor="middle" font-size="20" font-weight="700" fill="#29424A">Try it</text>
    <use href="#arrow" x="302" y="629" width="24" height="24" color="#29424A"/>
    <rect x="46" y="684" width="298" height="56" rx="14" fill="#FFFFFF" stroke="#697E83" stroke-width="1.25"/>
    <use href="#check" x="72" y="700" width="24" height="24" color="#287A55"/>
    <text x="207" y="719" text-anchor="middle" font-size="18" font-weight="700" fill="#29424A">I know this word</text>
    <text x="195" y="770" text-anchor="middle" font-size="13" fill="#536D75">Skip and review it later</text>
  </g>

  <!-- Connector -->
  <path d="M444 658h22" stroke="#697E83" stroke-width="1.5"/><use href="#arrow" x="448" y="646" width="24" height="24" color="#29424A"/>

  <!-- Screen 2 -->
  <g transform="translate(476 236)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect width="390" height="844" rx="20" fill="#DCF2FF" filter="url(#shadow)"/>
    <text x="24" y="40" font-size="16" font-weight="700" fill="#29424A">Lesson 1</text><text x="114" y="40" font-size="16" fill="#536D75">1 / 5</text>
    <rect x="22" y="104" width="346" height="692" rx="16" fill="#FFFFFF" stroke="#C6DAD9"/>
    <circle cx="195" cy="196" r="57" fill="#FFC938"/><use href="#apple" x="151" y="147" width="88" height="88"/>
    <text x="195" y="306" text-anchor="middle" font-size="52" font-weight="800" fill="#29424A">apple</text>
    <rect width="390" height="844" rx="20" fill="#29424A" opacity="0.46"/>
    <rect x="30" y="236" width="330" height="372" rx="20" fill="#FFFFFF" stroke="#C6DAD9" filter="url(#shadow)"/>
    <circle cx="195" cy="288" r="25" fill="#EDF8DE"/><use href="#check" x="183" y="276" width="24" height="24" color="#287A55"/>
    <text x="195" y="344" text-anchor="middle" font-size="27" font-weight="800" fill="#29424A">Skip this word?</text>
    <text x="195" y="384" text-anchor="middle" font-size="17" fill="#29424A">We’ll mark “apple” as learned</text>
    <text x="195" y="411" text-anchor="middle" font-size="17" fill="#29424A">and review it later.</text>
    <rect x="54" y="447" width="282" height="56" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25"/>
    <text x="195" y="482" text-anchor="middle" font-size="19" font-weight="700" fill="#29424A">Yes, skip</text>
    <rect x="54" y="519" width="282" height="56" rx="14" fill="#FFFFFF" stroke="#275D7D" stroke-width="2"/>
    <text x="195" y="554" text-anchor="middle" font-size="18" font-weight="700" fill="#275D7D">Keep practising</text>
    <text x="195" y="590" text-anchor="middle" font-size="12" fill="#536D75">Safe choice receives focus first</text>
  </g>

  <!-- Connector -->
  <path d="M876 658h22" stroke="#697E83" stroke-width="1.5"/><use href="#arrow" x="880" y="646" width="24" height="24" color="#29424A"/>

  <!-- Screen 3 -->
  <g transform="translate(908 236)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect width="390" height="844" rx="20" fill="#DCF2FF" filter="url(#shadow)"/>
    <circle cx="18" cy="85" r="3" fill="#F47E68"/><circle cx="368" cy="91" r="4" fill="#ACDF82"/>
    <text x="24" y="40" font-size="16" font-weight="700" fill="#29424A">Lesson 1</text><text x="114" y="40" font-size="16" fill="#536D75">2 / 5</text>
    <use href="#pause" x="285" y="20" width="24" height="24" color="#29424A"/><text x="318" y="40" font-size="16" font-weight="700" fill="#29424A">Pause</text>
    <g fill="#FFFFFF" stroke="#697E83"><rect x="139" y="67" width="16" height="6" rx="3" fill="#275D7D"/><rect x="163" y="67" width="16" height="6" rx="3"/><rect x="187" y="67" width="16" height="6" rx="3"/><rect x="211" y="67" width="16" height="6" rx="3"/><rect x="235" y="67" width="16" height="6" rx="3"/></g>
    <rect x="22" y="104" width="346" height="692" rx="16" fill="#FFFFFF" stroke="#C6DAD9" filter="url(#shadow)"/>
    <circle cx="195" cy="206" r="60" fill="#ACDF82"/><text x="195" y="226" text-anchor="middle" font-size="73">🐝</text>
    <text x="195" y="324" text-anchor="middle" font-size="52" font-weight="800" fill="#29424A">bee</text>
    <text x="195" y="363" text-anchor="middle" font-size="23" font-weight="600" fill="#29424A">蜜蜂</text>
    <rect x="101" y="391" width="188" height="54" rx="14" fill="#68BFEA" stroke="#697E83" stroke-width="1.25"/><use href="#sound" x="122" y="406" width="24" height="24" color="#29424A"/><text x="205" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#29424A">Listen</text>
    <rect x="46" y="613" width="298" height="56" rx="14" fill="#FFC938" stroke="#697E83" stroke-width="1.25"/><text x="183" y="648" text-anchor="middle" font-size="20" font-weight="700" fill="#29424A">Try it</text><use href="#arrow" x="302" y="629" width="24" height="24" color="#29424A"/>
    <rect x="46" y="684" width="298" height="56" rx="14" fill="#FFFFFF" stroke="#697E83" stroke-width="1.25"/><use href="#check" x="72" y="700" width="24" height="24" color="#287A55"/><text x="207" y="719" text-anchor="middle" font-size="18" font-weight="700" fill="#29424A">I know this word</text>
    <rect x="38" y="764" width="314" height="56" rx="14" fill="#287A55"/>
    <circle cx="67" cy="792" r="13" fill="#FFFFFF"/><use href="#check" x="58" y="783" width="18" height="18" color="#287A55"/>
    <text x="92" y="798" font-size="15" font-weight="700" fill="#FFFFFF">apple · Learned</text>
  </g>

  <!-- Rules panel -->
  <g transform="translate(1338 236)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect width="238" height="844" rx="18" fill="#EDF8DE" stroke="#C6DAD9" filter="url(#shadow)"/>
    <text x="24" y="46" font-size="22" font-weight="800" fill="#29424A">行为规则</text>
    <circle cx="30" cy="92" r="11" fill="#FFC938"/><text x="30" y="97" text-anchor="middle" font-size="12" font-weight="800" fill="#29424A">1</text>
    <text x="53" y="98" font-size="16" font-weight="700" fill="#29424A">只在新课词卡出现</text>
    <text x="24" y="131" font-size="14" fill="#536D75">复习和自由练习不显示，</text><text x="24" y="154" font-size="14" fill="#536D75">避免改变既有判定。</text>
    <circle cx="30" cy="205" r="11" fill="#FFC938"/><text x="30" y="210" text-anchor="middle" font-size="12" font-weight="800" fill="#29424A">2</text>
    <text x="53" y="211" font-size="16" font-weight="700" fill="#29424A">确认后记为“学过”</text>
    <text x="24" y="244" font-size="14" fill="#536D75">不会直接成为“记牢了”；</text><text x="24" y="267" font-size="14" fill="#536D75">次日进入正常复习。</text>
    <circle cx="30" cy="318" r="11" fill="#FFC938"/><text x="30" y="323" text-anchor="middle" font-size="12" font-weight="800" fill="#29424A">3</text>
    <text x="53" y="324" font-size="16" font-weight="700" fill="#29424A">误触可以安全退出</text>
    <text x="24" y="357" font-size="14" fill="#536D75">Escape、遮罩或 Keep</text><text x="24" y="380" font-size="14" fill="#536D75">practising 都不改进度。</text>
    <circle cx="30" cy="431" r="11" fill="#FFC938"/><text x="30" y="436" text-anchor="middle" font-size="12" font-weight="800" fill="#29424A">4</text>
    <text x="53" y="437" font-size="16" font-weight="700" fill="#29424A">立即保存与反馈</text>
    <text x="24" y="470" font-size="14" fill="#536D75">确认后原子保存，再进入</text><text x="24" y="493" font-size="14" fill="#536D75">下一词并播报状态。</text>
    <path d="M24 535H214" stroke="#C6DAD9"/>
    <text x="24" y="578" font-size="18" font-weight="800" fill="#29424A">可访问性</text>
    <text x="24" y="612" font-size="14" fill="#536D75">• 两个按钮均至少 44 px</text>
    <text x="24" y="641" font-size="14" fill="#536D75">• 弹窗锁定并恢复焦点</text>
    <text x="24" y="670" font-size="14" fill="#536D75">• 安全选项首先获得焦点</text>
    <text x="24" y="699" font-size="14" fill="#536D75">• 成功反馈由读屏播报</text>
    <path d="M24 741H214" stroke="#C6DAD9"/>
    <text x="24" y="780" font-size="14" font-weight="700" fill="#287A55">不增加新的颜色或图标。</text>
  </g>

  <circle cx="61" cy="1156" r="17" fill="#FFC938"/><text x="61" y="1162" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#29424A">1</text>
  <text x="92" y="1162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="800" fill="#29424A">“Try it”仍是主操作</text>
  <text x="92" y="1193" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#29424A">跳过使用白底次要按钮，保持选择明确，不催促孩子跳过。</text>
  <circle cx="641" cy="1156" r="17" fill="#FFC938"/><text x="641" y="1162" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#29424A">2</text>
  <text x="672" y="1162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="800" fill="#29424A">确认说明真实结果</text>
  <text x="672" y="1193" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#29424A">明确“学过、以后复习”，不把自我判断包装成已经记牢。</text>
  <path d="M44 1271H1576" stroke="#C6DAD9" stroke-width="1.5"/>
  <text x="44" y="1297" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#536D75">小小英语 · 静态设计样例 · SVG 图形与系统 emoji</text>
  <text x="1576" y="1297" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#29424A">07-skip-word</text>
</svg>
