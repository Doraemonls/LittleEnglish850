name: Verify and publish

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run content:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Provide audio output for headless Firefox
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl info
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: '1'
      - name: Save tested website
        uses: actions/upload-artifact@v7.0.2
        with:
          name: little-english-${{ github.sha }}
          path: dist/
          retention-days: 7
      - name: Prepare tested website for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Publish tested website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
